name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Engine + server tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM builds
        uses: actions/cache@v4
        with:
          path: |
            BattleshipKit/.build
            Server/.build
          key: linux-swiftpm-${{ hashFiles('Server/Package.resolved', 'Server/Package.swift', 'BattleshipKit/Package.swift') }}
          restore-keys: linux-swiftpm-
      - name: BattleshipKit tests
        run: swift test --package-path BattleshipKit
      - name: Server tests
        run: swift test --package-path Server

  server-postgres:
    name: Server tests on Postgres (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.3-noble
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: battleships
          POSTGRES_PASSWORD: battleships
          POSTGRES_DB: battleships_test
        options: >-
          --health-cmd "pg_isready -U battleships -d battleships_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM builds
        uses: actions/cache@v4
        with:
          path: |
            BattleshipKit/.build
            Server/.build
          key: linux-swiftpm-${{ hashFiles('Server/Package.resolved', 'Server/Package.swift', 'BattleshipKit/Package.swift') }}
          restore-keys: linux-swiftpm-
      # The tests wipe this database before each one (see ServerTestCase).
      - name: Server tests
        env:
          TEST_DATABASE_URL: postgres://battleships:battleships@postgres:5432/battleships_test
        run: swift test --package-path Server

  server-macos:
    name: Server tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_[0-9.]+\.app$' | sort -V | tail -n 1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          swift --version
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: Server/.build
          key: macos-swiftpm-${{ hashFiles('Server/Package.resolved', 'Server/Package.swift') }}
          restore-keys: macos-swiftpm-
      # Also exercises the app's URLSession WebSocket client against the real server.
      - name: Server tests
        run: swift test --package-path Server

  ios:
    name: iOS app (build + unit tests)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_[0-9.]+\.app$' | sort -V | tail -n 1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in devices:
                  if device["name"].startswith("iPhone") and (best is None or version > best[0]):
                      best = (version, device["udid"], device["name"])
          print(best[1])
          print(f"Simulator: {best[2]} (iOS {best[0][0]}.{best[0][1]})", file=sys.stderr)
          ')"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      # A video of the simulator for the whole test run, so the animations the screenshot test
      # plays (its filmstrips, each introduced by a magenta title card) can be watched frame by
      # frame from the artifact. Snapshots from inside the test are too slow to catch motion.
      - name: Start recording the simulator
        id: recording
        run: |
          udid="${{ steps.simulator.outputs.udid }}"
          xcrun simctl boot "$udid" 2> /dev/null || true
          xcrun simctl bootstatus "$udid" -b > /dev/null
          mkdir -p build
          xcrun simctl io "$udid" recordVideo --codec h264 --force build/motion.mp4 > build/recording.log 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"
          sleep 3
      - name: Build and test
        env:
          # Lets the screenshot test render the main screens (see BattleshipsTests/ScreenshotTests.swift).
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/build/screenshots
        run: |
          set -o pipefail
          # Tests run on the recorded simulator itself rather than a clone of it.
          xcodebuild test \
            -project iOSApp/Battleships.xcodeproj \
            -scheme Battleships \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath build/Battleships.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: Stop recording
        if: always()
        run: |
          pid="${{ steps.recording.outputs.pid }}"
          if [ -n "$pid" ]; then
            kill -INT "$pid" 2> /dev/null || true
            for _ in $(seq 1 30); do
              kill -0 "$pid" 2> /dev/null || break
              sleep 1
            done
          fi
          ls -la build/motion.mp4 2> /dev/null || cat build/recording.log || true
      - name: Upload the simulator video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-video
          path: build/motion.mp4
          if-no-files-found: warn
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: ignore
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Battleships.xcresult
          path: build/Battleships.xcresult

  docker:
    name: Server Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Server/Dockerfile
          tags: battleships-server:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name battleships -p 8080:8080 battleships-server:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && break
            sleep 2
          done
          curl -fsS -X POST http://localhost:8080/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci_smoke","password":"long enough"}'
          echo
          docker logs battleships
